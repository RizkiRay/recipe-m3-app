<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Resep: {{ recipe.title }} — Admin</title>
  <link rel="stylesheet" href="/static/css/m3-theme.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    .editor-container {
      max-width: 680px;
      margin: 0 auto;
      padding: 16px 12px 100px;
    }
    .form-section {
      background: var(--md-sys-color-surface-container-low);
      border: 1px solid var(--md-sys-color-outline-variant);
      border-radius: var(--md-sys-shape-corner-large);
      padding: 16px 14px;
      margin-bottom: 16px;
    }
    .section-head {
      font-size: 1.05rem;
      font-weight: 800;
      color: var(--md-sys-color-on-surface);
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
      margin-bottom: 12px;
    }
    .form-group label {
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--md-sys-color-outline);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .form-control {
      width: 100%;
      padding: 10px 12px;
      background: var(--md-sys-color-surface-container-lowest);
      border: 1px solid var(--md-sys-color-outline-variant);
      border-radius: var(--md-sys-shape-corner-medium);
      color: var(--md-sys-color-on-surface);
      font-family: inherit;
      font-size: 0.9rem;
      outline: none;
    }
    .form-control:focus {
      border-color: var(--md-sys-color-primary);
    }
    .form-grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    
    /* Mobile-first card style for ingredient items */
    .ing-card-item {
      background: var(--md-sys-color-surface-container-lowest);
      border: 1px solid var(--md-sys-color-outline-variant);
      border-radius: var(--md-sys-shape-corner-medium);
      padding: 12px;
      margin-bottom: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      position: relative;
    }
    .ing-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .ing-card-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    
    /* Mobile-first card style for steps */
    .step-card-item {
      background: var(--md-sys-color-surface-container-lowest);
      border: 1px solid var(--md-sys-color-outline-variant);
      border-radius: var(--md-sys-shape-corner-medium);
      padding: 12px;
      margin-bottom: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .step-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .step-card-timer {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .btn-row-del {
      background: var(--md-sys-color-surface-container-highest);
      border: none;
      color: #ba1a1a;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      border-radius: var(--md-sys-shape-corner-full);
      flex-shrink: 0;
    }
    .btn-add-item {
      width: 100%;
      padding: 10px 14px;
      border-radius: var(--md-sys-shape-corner-medium);
      border: 1px dashed var(--md-sys-color-primary);
      background: transparent;
      color: var(--md-sys-color-primary);
      font-family: inherit;
      font-size: 0.88rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-top: 6px;
    }
    .editor-bottom-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--md-sys-color-surface-container);
      border-top: 1px solid var(--md-sys-color-outline-variant);
      padding: 10px 14px calc(10px + env(safe-area-inset-bottom));
      z-index: 100;
      box-shadow: var(--md-sys-elevation-3);
    }
    .editor-bar-wrapper {
      max-width: 680px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
    }
    .btn-editor-action {
      height: 48px;
      border-radius: var(--md-sys-shape-corner-medium);
      border: none;
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      text-decoration: none;
      transition: all 0.15s ease;
    }
    .btn-editor-action:active {
      transform: scale(0.96);
    }
    .btn-editor-action.cancel {
      flex: 1;
      background: var(--md-sys-color-surface-container-highest);
      color: var(--md-sys-color-on-surface);
    }
    .btn-editor-action.save {
      flex: 1;
      background: var(--md-sys-color-primary);
      color: var(--md-sys-color-on-primary);
    }
  </style>
</head>
<body>

  <!-- Top App Bar -->
  <header class="top-app-bar" style="padding: 14px 16px; min-height: 64px;">
    <div class="brand-wrapper">
      <a href="/admin" style="text-decoration: none; color: inherit; display: flex; align-items: center; gap: 8px;">
        <div class="brand-icon">
          <i data-lucide="arrow-left" style="width: 18px; height: 18px;"></i>
        </div>
        <h1 style="font-size: 1.05rem;">Edit Resep</h1>
      </a>
    </div>
    <div style="font-size: 0.8rem; font-weight: 800; color: var(--md-sys-color-primary);">
      ID #{{ recipe.id }}
    </div>
  </header>

  <main class="editor-container">
    
    <!-- Meta Info Section -->
    <section class="form-section">
      <div class="section-head">
        <i data-lucide="info" style="width: 18px; height: 18px; color: var(--md-sys-color-primary);"></i>
        Informasi Utama
      </div>
      
      <div class="form-group">
        <label>Judul Masakan</label>
        <input type="text" id="recipeTitle" class="form-control" value="{{ recipe.title }}">
      </div>

      <div class="form-grid-2">
        <div class="form-group">
          <label>Koki / Pembuat</label>
          <input type="text" id="recipeChef" class="form-control" value="{{ recipe.chef }}">
        </div>
        <div class="form-group">
          <label>Porsi Sajian</label>
          <input type="text" id="recipeServings" class="form-control" value="{{ recipe.servings }}">
        </div>
      </div>

      <div class="form-grid-2">
        <div class="form-group">
          <label>Durasi Persiapan</label>
          <input type="text" id="recipePrepTime" class="form-control" value="{{ recipe.prep_time }}">
        </div>
        <div class="form-group">
          <label>Durasi Memasak</label>
          <input type="text" id="recipeCookTime" class="form-control" value="{{ recipe.cook_time }}">
        </div>
      </div>

      <div class="form-group">
        <label>Link Video Sumber (YouTube / Instagram)</label>
        <input type="text" id="recipeMediaUrl" class="form-control" value="{{ recipe.media_url or '' }}">
      </div>

      <div class="form-group">
        <label>Deskripsi Singkat</label>
        <textarea id="recipeDesc" class="form-control" rows="2">{{ recipe.description }}</textarea>
      </div>
    </section>

    <!-- Ingredients Section -->
    <section class="form-section">
      <div class="section-head">
        <i data-lucide="carrot" style="width: 18px; height: 18px; color: var(--md-sys-color-primary);"></i>
        Daftar Bahan & Takaran
      </div>

      <div id="ingredientsList">
        {% for g in recipe.ingredient_groups %}
          {% for item in g.ingredients_list %}
            <div class="ing-card-item">
              <div class="ing-card-header">
                <input type="text" class="form-control ing-item" style="font-weight: 700;" placeholder="Nama Bahan (contoh: Daging Ayam)" value="{{ item.item }}">
                <button type="button" class="btn-row-del" onclick="this.closest('.ing-card-item').remove()" title="Hapus Bahan">
                  <i data-lucide="trash-2" style="width: 14px; height: 14px;"></i>
                </button>
              </div>
              <div class="ing-card-grid">
                <div>
                  <label style="font-size: 0.68rem; font-weight: 700; color: var(--md-sys-color-outline);">JUMLAH</label>
                  <input type="text" class="form-control ing-amount" placeholder="contoh: 500" value="{{ item.amount }}">
                </div>
                <div>
                  <label style="font-size: 0.68rem; font-weight: 700; color: var(--md-sys-color-outline);">SATUAN</label>
                  <input type="text" class="form-control ing-unit" placeholder="contoh: gr, sdm, sdt" value="{{ item.unit }}">
                </div>
              </div>
              <div>
                <label style="font-size: 0.68rem; font-weight: 700; color: var(--md-sys-color-outline);">CATATAN PERSIAPAN (OPSIONAL)</label>
                <input type="text" class="form-control ing-notes" placeholder="contoh: Giling halus / iris tipis" value="{{ item.notes }}">
              </div>
            </div>
          {% endfor %}
        {% endfor %}
      </div>

      <button type="button" class="btn-add-item" onclick="addIngredientRow()">
        <i data-lucide="plus" style="width: 16px; height: 16px;"></i>
        Tambah Bahan Baru
      </button>
    </section>

    <!-- Steps Section -->
    <section class="form-section">
      <div class="section-head">
        <i data-lucide="list-ordered" style="width: 18px; height: 18px; color: var(--md-sys-color-primary);"></i>
        Instruksi Langkah Memasak
      </div>

      <div id="stepsList">
        {% for s in recipe.instructions %}
          <div class="step-card-item">
            <div class="step-card-header">
              <span style="font-size: 0.75rem; font-weight: 800; color: var(--md-sys-color-primary);">
                LANGKAH {{ loop.index }}
              </span>
              <button type="button" class="btn-row-del" onclick="this.closest('.step-card-item').remove()" title="Hapus Langkah">
                <i data-lucide="trash-2" style="width: 14px; height: 14px;"></i>
              </button>
            </div>
            <div>
              <textarea class="form-control step-detail" rows="2" placeholder="Instruksi Memasak">{{ s.detail }}</textarea>
            </div>
            <div class="step-card-timer">
              <label style="font-size: 0.72rem; font-weight: 700; color: var(--md-sys-color-outline); white-space: nowrap;">TIMER (DETIK):</label>
              <input type="number" class="form-control step-timer" style="max-width: 120px;" placeholder="0 detik" value="{{ s.timer_seconds }}">
            </div>
          </div>
        {% endfor %}
      </div>

      <button type="button" class="btn-add-item" onclick="addStepRow()">
        <i data-lucide="plus" style="width: 16px; height: 16px;"></i>
        Tambah Langkah Baru
      </button>
    </section>

  </main>

  <!-- Sticky Bottom Save Bar -->
  <footer class="editor-bottom-bar">
    <div class="editor-bar-wrapper">
      <a href="/admin" class="btn-editor-action cancel">
        <i data-lucide="x" style="width: 18px; height: 18px;"></i>
        Batal
      </a>
      <button type="button" class="btn-editor-action save" onclick="saveRecipeData()">
        <i data-lucide="save" style="width: 18px; height: 18px;"></i>
        Simpan Resep
      </button>
    </div>
  </footer>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (window.lucide) lucide.createIcons();
    });

    function addIngredientRow() {
      const div = document.createElement('div');
      div.className = 'ing-card-item';
      div.innerHTML = `
        <div class="ing-card-header">
          <input type="text" class="form-control ing-item" style="font-weight: 700;" placeholder="Nama Bahan">
          <button type="button" class="btn-row-del" onclick="this.closest('.ing-card-item').remove()">
            <i data-lucide="trash-2" style="width: 14px; height: 14px;"></i>
          </button>
        </div>
        <div class="ing-card-grid">
          <div>
            <label style="font-size: 0.68rem; font-weight: 700; color: var(--md-sys-color-outline);">JUMLAH</label>
            <input type="text" class="form-control ing-amount" placeholder="contoh: 500">
          </div>
          <div>
            <label style="font-size: 0.68rem; font-weight: 700; color: var(--md-sys-color-outline);">SATUAN</label>
            <input type="text" class="form-control ing-unit" placeholder="contoh: gr">
          </div>
        </div>
        <div>
          <label style="font-size: 0.68rem; font-weight: 700; color: var(--md-sys-color-outline);">CATATAN PERSIAPAN</label>
          <input type="text" class="form-control ing-notes" placeholder="contoh: Giling halus">
        </div>
      `;
      document.getElementById('ingredientsList').appendChild(div);
      if (window.lucide) lucide.createIcons();
    }

    function addStepRow() {
      const currentCount = document.querySelectorAll('#stepsList .step-card-item').length + 1;
      const div = document.createElement('div');
      div.className = 'step-card-item';
      div.innerHTML = `
        <div class="step-card-header">
          <span style="font-size: 0.75rem; font-weight: 800; color: var(--md-sys-color-primary);">
            LANGKAH ${currentCount}
          </span>
          <button type="button" class="btn-row-del" onclick="this.closest('.step-card-item').remove()">
            <i data-lucide="trash-2" style="width: 14px; height: 14px;"></i>
          </button>
        </div>
        <div>
          <textarea class="form-control step-detail" rows="2" placeholder="Instruksi Memasak"></textarea>
        </div>
        <div class="step-card-timer">
          <label style="font-size: 0.72rem; font-weight: 700; color: var(--md-sys-color-outline); white-space: nowrap;">TIMER (DETIK):</label>
          <input type="number" class="form-control step-timer" style="max-width: 120px;" placeholder="0 detik" value="0">
        </div>
      `;
      document.getElementById('stepsList').appendChild(div);
      if (window.lucide) lucide.createIcons();
    }

    async function saveRecipeData() {
      const id = "{{ recipe.id }}";
      const payload = {
        title: document.getElementById('recipeTitle').value.trim(),
        chef: document.getElementById('recipeChef').value.trim(),
        prep_time: document.getElementById('recipePrepTime').value.trim(),
        cook_time: document.getElementById('recipeCookTime').value.trim(),
        servings: document.getElementById('recipeServings').value.trim(),
        media_url: document.getElementById('recipeMediaUrl').value.trim(),
        description: document.getElementById('recipeDesc').value.trim(),
        ingredients: [],
        steps: []
      };

      document.querySelectorAll('#ingredientsList .ing-card-item').forEach(card => {
        const item = card.querySelector('.ing-item').value.trim();
        const amount = card.querySelector('.ing-amount').value.trim();
        const unit = card.querySelector('.ing-unit').value.trim();
        const notes = card.querySelector('.ing-notes').value.trim();
        if (item) {
          payload.ingredients.push({ item, amount, unit, notes });
        }
      });

      document.querySelectorAll('#stepsList .step-card-item').forEach((card, idx) => {
        const detail = card.querySelector('.step-detail').value.trim();
        const timer = parseInt(card.querySelector('.step-timer').value || 0);
        if (detail) {
          payload.steps.push({ step_number: idx + 1, detail, timer_seconds: timer });
        }
      });

      try {
        const res = await fetch(`/api/admin/recipe/${id}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        if (res.ok) {
          alert('Perubahan resep berhasil disimpan!');
          window.location.href = '/admin';
        } else {
          alert('Gagal menyimpan resep.');
        }
      } catch (err) {
        alert('Error: ' + err.message);
      }
    }
  </script>
</body>
</html>
